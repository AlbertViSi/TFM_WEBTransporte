<div class="content-wrapper">

  <h2>Gestión de Baneos</h2>

  <button (click)="goToBanCreate()">
    Añadir Ban
  </button>

  <div class="search-box">
    <input
      type="text"
      placeholder="Buscar DNI"
      [(ngModel)]="search"
    />
  </div>

  <div class="table">

    <div class="row header">
      <div>DNI</div>
      <div>Razón</div>
      <div>Expiración</div>
      <div>Estado</div>
      <div></div>
    </div>

    <div 
      class="row"
      *ngFor="let ban of filteredBans"
    >
      <div>{{ ban.dni }}</div>
      <div>{{ ban.reason }}</div>
      <div>{{ ban.expires_at | date }}</div>
      <div>{{ ban.status }}</div>

      <div>
        <button (click)="deleteBan(ban.id)">
          Eliminar
        </button>
      </div>
    </div>

  </div>

</div>
