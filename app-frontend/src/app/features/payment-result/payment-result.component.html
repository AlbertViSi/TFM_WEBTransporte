<div class="payment-wrapper">

  <h2>Simulación de pago</h2>

  <div *ngIf="loading">
    Procesando pago...
  </div>

  <div *ngIf="!loading && !success && !error" class="payment-actions">

    <p>Simulación de plataforma de pago</p>

    <div class="buttons">
      <button (click)="confirmPayment()">
        Pago aceptado
      </button>

      <button class="secondary" (click)="rejectPayment()">
        Pago rechazado
      </button>
    </div>
  </div>

  <div *ngIf="success" class="result success">
    <h3>Pago aceptado</h3>
    <p>Reserva confirmada correctamente</p>

    <button (click)="goHome()">
      Volver al inicio
    </button>
  </div>

  <div *ngIf="error" class="result error">
    <h3>Error</h3>
    <p>{{ error }}</p>

    <button (click)="goHome()">
      Volver al inicio
    </button>
  </div>
</div>
