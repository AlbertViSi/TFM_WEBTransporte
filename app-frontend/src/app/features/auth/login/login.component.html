<h2>Login</h2>

<div class="auth-container">

  <label>Usuario</label>
  <input 
    type="text" 
    placeholder="Usuario"
    [(ngModel)]="username"
  />

  <label>Password</label>
  <input 
    type="password" 
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button (click)="login()">
    Login
  </button>

</div>
