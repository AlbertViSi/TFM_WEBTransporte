<div class="search-wrapper">

  <form [formGroup]="form" (ngSubmit)="search()" class="search-form">

    <div class="field">
      <label>Origen</label>
      <app-autofill 
        label="Origen"
        [options]="origins"
        (selected)="setOrigin($event)"
      ></app-autofill>
    </div>

    <div class="field">
      <label>Destino</label>
      <app-autofill 
        label="Destino"
        [options]="destinations"
        (selected)="setDestination($event)"
      ></app-autofill>
    </div>

    <div class="field">
      <label>Fecha</label>
      <input 
        type="date"
        [min]="minDate"
        formControlName="date"
      />
    </div>

    <div class="actions">
      <button 
        type="submit" 
        [disabled]="form.invalid || !originId || !destinationId">
        Buscar
      </button>
    </div>

  </form>

</div>
