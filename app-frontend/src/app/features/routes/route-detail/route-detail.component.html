<div class="content-wrapper">
  <h2>Detalles</h2>

  <div *ngIf="route" class="detail-card">
    <h3 class="card-title">
      Ruta {{ route.name }}
    </h3>

    <p class="route-path">
      {{ originName }} - {{ destinationName }}
    </p>

    <p>
      Precio: {{ price }}€
    </p>

    <p>
      ⭐ {{ ratingAvg }} ({{ ratingCount }} valoraciones)
    </p>
  </div>

  <div class="action">
    <button 
      *ngIf="isLogged"
      (click)="goToReservation()">
      Reservar
    </button>
  </div>

  <h3 class="comments-title">Comentarios</h3>

  <div class="comments-list">
    <div class="comment" *ngFor="let comment of comments">
      <strong>{{ comment.username }}</strong>

      <p>{{ comment.content }}</p>

      <small>
        {{ comment.created_at | date:'short' }}
      </small>
    </div>
  </div>
</div>
